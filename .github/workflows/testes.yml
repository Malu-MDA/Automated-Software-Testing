name: Testes Python

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar pytest
        run: pip install pytest

      - name: Executar os testes
        run: pytest